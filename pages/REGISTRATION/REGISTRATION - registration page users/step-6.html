<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registratie stap 6 | Zorgpunt Connect</title>
  <link rel="stylesheet" href="../registration.css">
</head>
<body class="registration-page registration-step-page">
  <div class="registration-flow registration-flow--steps">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Zorgpunt Connect home"><img class="zorgpunt-logo" src="./assets/zorgpunt-logo.png" alt="Zorgpunt Connect"></a>
      <a class="help-link" href="tel:+31850300827"><span>Hulp nodig?</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8.4 10.9a15.7 15.7 0 0 0 4.7 4.7l1.6-1.6a1.2 1.2 0 0 1 1.2-.3c1.3.4 2.7.7 4.1.7.7 0 1.2.5 1.2 1.2V20c0 .7-.5 1.2-1.2 1.2C10.5 21.2 2.8 13.5 2.8 4c0-.7.5-1.2 1.2-1.2h4.4c.7 0 1.2.5 1.2 1.2 0 1.4.2 2.8.7 4.1.1.4 0 .9-.3 1.2l-1.6 1.6Z"/></svg><strong>+31 85 0300827</strong><svg class="help-chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></a>
    </header>
    <main class="step-layout">
      <section class="step-card" aria-labelledby="step-title">
        <nav class="step-progress" aria-label="Registratie voortgang">
          <span class="step-progress__item">1</span><span class="step-progress__line is-complete"></span>
          <span class="step-progress__item">2</span><span class="step-progress__line is-complete"></span>
          <span class="step-progress__item">3</span><span class="step-progress__line is-complete"></span>
          <span class="step-progress__item">4</span><span class="step-progress__line is-complete"></span>
          <span class="step-progress__item">5</span><span class="step-progress__line is-complete"></span>
          <span class="step-progress__item is-active" aria-current="step">6</span>
        </nav>
        <div class="step-content">
          <p class="step-counter">6 van 6</p>
          <div class="step-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.4"/><path d="M3.8 19c.4-4 2.4-6.1 5.2-6.1s4.8 2.1 5.2 6.1M13.7 13.7c.8-.8 1.8-1.2 3-1.2 2.2 0 3.7 1.7 4 4.8"/></svg>
          </div>
          <h1 id="step-title">Upload je CV</h1>
          <p class="step-subtitle">Upload je actuele CV (PDF, DOC of DOCX).</p>
          <form aria-labelledby="step-title">
            <label class="upload-zone" for="cv-upload">
              <input class="upload-zone__input" id="cv-upload" name="cv" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
              <span class="upload-zone__content">
                <span class="upload-zone__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M7 18.5H5.8a3.8 3.8 0 0 1-.5-7.5A6.4 6.4 0 0 1 17.6 9a4.8 4.8 0 0 1 .6 9.5H17"/><path d="M12 19V11M8.8 14.2 12 11l3.2 3.2"/></svg>
                </span>
                <span class="upload-zone__title">Klik om te uploaden</span>
                <span class="upload-zone__hint">of sleep je bestand hierheen</span>
                <span class="upload-zone__meta">PDF, DOC of DOCX<span>(max. 10MB)</span></span>
              </span>
            </label>
          </form>
        </div>
        <div class="step-actions step-actions--finish">
          <a class="step-button step-button--secondary" href="./step-5.html"><span aria-hidden="true">←</span> Vorige</a>
          <a class="step-button step-button--primary" href="./finish.html">Aanmelding afronden <span aria-hidden="true">→</span></a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
