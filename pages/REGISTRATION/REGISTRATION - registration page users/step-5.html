<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registratie stap 5 | Zorgpunt Connect</title>
  <link rel="stylesheet" href="../registration.css">
</head>
<body class="registration-page registration-step-page">
  <div class="registration-flow registration-flow--steps">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Zorgpunt Connect home"><img class="zorgpunt-logo" src="./assets/zorgpunt-logo.png" alt="Zorgpunt Connect"></a>
      <a class="help-link" href="tel:+31850300827"><span>Hulp nodig?</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8.4 10.9a15.7 15.7 0 0 0 4.7 4.7l1.6-1.6a1.2 1.2 0 0 1 1.2-.3c1.3.4 2.7.7 4.1.7.7 0 1.2.5 1.2 1.2V20c0 .7-.5 1.2-1.2 1.2C10.5 21.2 2.8 13.5 2.8 4c0-.7.5-1.2 1.2-1.2h4.4c.7 0 1.2.5 1.2 1.2 0 1.4.2 2.8.7 4.1.1.4 0 .9-.3 1.2l-1.6 1.6Z"/></svg><strong>+31 85 0300827</strong><svg class="help-chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></a>
    </header>
    <main class="step-layout">
      <section class="step-card" aria-labelledby="step-title">
        <nav class="step-progress" aria-label="Registratie voortgang">
          <span class="step-progress__item">1</span><span class="step-progress__line is-complete"></span>
          <span class="step-progress__item">2</span><span class="step-progress__line is-complete"></span>
          <span class="step-progress__item">3</span><span class="step-progress__line is-complete"></span>
          <span class="step-progress__item">4</span><span class="step-progress__line is-complete"></span>
          <span class="step-progress__item is-active" aria-current="step">5</span><span class="step-progress__line"></span>
          <span class="step-progress__item">6</span>
        </nav>
        <div class="step-content">
          <p class="step-counter">5 van 6</p>
          <div class="step-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M14.7 4.2c2.1-.8 4-.9 5.1-.8.1 1.2 0 3-.8 5.1-.9 2.3-2.5 4.5-5 6.6l-5.1-5.1c2-2.6 4.2-4.1 5.8-5.8Z"/><path d="m11.1 12.2-3.2 3.2-3.3.6.6-3.3 3.2-3.2M13.9 14.9l-3.2 3.2.6 3.3 3.3-.6 3.2-3.2"/><circle cx="15.9" cy="7.3" r="1.6"/><path d="M8.3 16.8 5 20.1"/></svg>
          </div>
          <h1 id="step-title">Wanneer kun je starten?</h1>
          <p class="step-subtitle">Laat ons weten wanneer je beschikbaar bent.</p>
          <form class="choice-list choice-list--travel" aria-labelledby="step-title">
            <div class="choice-row choice-row--compact">
              <input type="radio" name="start-date" value="immediately" id="start-immediately" checked>
              <label for="start-immediately"><span>Per direct</span><span class="choice-selected" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 10.5 8.2 13.5 15 7.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></label>
            </div>
            <div class="choice-row choice-row--compact">
              <input type="radio" name="start-date" value="one-week" id="start-one-week">
              <label for="start-one-week"><span>Binnen 1 week</span><span class="choice-selected" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 10.5 8.2 13.5 15 7.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></label>
            </div>
            <div class="choice-row choice-row--compact">
              <input type="radio" name="start-date" value="two-weeks" id="start-two-weeks">
              <label for="start-two-weeks"><span>Binnen 2 weken</span><span class="choice-selected" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 10.5 8.2 13.5 15 7.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></label>
            </div>
            <div class="choice-row choice-row--compact">
              <input type="radio" name="start-date" value="one-month" id="start-one-month">
              <label for="start-one-month"><span>Binnen 1 maand</span><span class="choice-selected" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 10.5 8.2 13.5 15 7.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></label>
            </div>
            <div class="choice-row choice-row--compact">
              <input type="radio" name="start-date" value="later" id="start-later">
              <label for="start-later"><span>Later, namelijk:</span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b95a5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="15" rx="2"/><path d="M7.5 3.5v4M16.5 3.5v4M3.5 9.5h17"/></svg></label>
            </div>
          </form>
        </div>
        <div class="step-actions">
          <a class="step-button step-button--secondary" href="./step-4.html"><span aria-hidden="true">←</span> Vorige</a>
          <a class="step-button step-button--primary" href="./step-6.html">Volgende <span aria-hidden="true">→</span></a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
