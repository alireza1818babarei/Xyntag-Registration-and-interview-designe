<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registratie stap 4 | Zorgpunt Connect</title>
  <link rel="stylesheet" href="./registration.css">
</head>
<body class="registration-page registration-step-page">
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Zorgpunt Connect home"><img class="zorgpunt-logo" src="./assets/zorgpunt-logo.png" alt="Zorgpunt Connect"></a>
    <a class="help-link" href="tel:+31850300827"><span>Hulp nodig?</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8.4 10.9a15.7 15.7 0 0 0 4.7 4.7l1.6-1.6a1.2 1.2 0 0 1 1.2-.3c1.3.4 2.7.7 4.1.7.7 0 1.2.5 1.2 1.2V20c0 .7-.5 1.2-1.2 1.2C10.5 21.2 2.8 13.5 2.8 4c0-.7.5-1.2 1.2-1.2h4.4c.7 0 1.2.5 1.2 1.2 0 1.4.2 2.8.7 4.1.1.4 0 .9-.3 1.2l-1.6 1.6Z"/></svg><strong>+31 85 0300827</strong><svg class="help-chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></a>
  </header>

  <main class="step-layout">
    <section class="step-card" aria-labelledby="step-title">
      <nav class="step-progress" aria-label="Registratie voortgang">
        <span class="step-progress__item">1</span><span class="step-progress__line is-complete"></span>
        <span class="step-progress__item">2</span><span class="step-progress__line is-complete"></span>
        <span class="step-progress__item">3</span><span class="step-progress__line is-complete"></span>
        <span class="step-progress__item is-active" aria-current="step">4</span><span class="step-progress__line"></span>
        <span class="step-progress__item">5</span><span class="step-progress__line"></span>
        <span class="step-progress__item">6</span>
      </nav>

      <div class="step-content">
        <p class="step-counter">4 van 6</p>
        <div class="step-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20S4 15.2 4 9.4C4 6.9 5.9 5 8.3 5c1.5 0 2.9.8 3.7 2 .8-1.2 2.2-2 3.7-2C18.1 5 20 6.9 20 9.4 20 15.2 12 20 12 20Z"/></svg></div>
        <h1 id="step-title">Met welke cliëntgroepen werk je het liefst?</h1>
        <p class="step-subtitle">Je kunt meerdere opties kiezen.</p>

        <form class="check-list">
          <label class="check-row"><input type="checkbox" checked><span class="check-box">✓</span><span>Ouderenzorg</span></label>
          <label class="check-row"><input type="checkbox" checked><span class="check-box">✓</span><span>Gehandicaptenzorg</span></label>
          <label class="check-row"><input type="checkbox" checked><span class="check-box">✓</span><span>Jeugdzorg</span></label>
          <label class="check-row"><input type="checkbox" checked><span class="check-box">✓</span><span>GGZ / Psychiatrie</span></label>
          <label class="check-row"><input type="checkbox" checked><span class="check-box">✓</span><span>Verpleging &amp; Verzorging</span></label>
          <label class="check-row"><input type="checkbox"><span class="check-box">✓</span><span>Overig</span></label>
          <textarea class="step-textarea" rows="2" placeholder="Toelichting (optioneel)" aria-label="Toelichting"></textarea>
        </form>
      </div>

      <div class="step-actions">
        <a class="step-button step-button--secondary" href="./step-3.html"><span aria-hidden="true">←</span> Vorige</a>
        <a class="step-button step-button--primary" href="#">Volgende <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>
</body>
</html>
